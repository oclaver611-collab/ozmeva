       margin: 32px 0 14px; padding-bottom: 6px; border-bottom: 1px solid #333; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a2a; }

  .card-vibe { font-size: 11px; color: #666; margin-left: auto; }

  .video-wrap video { width: 100%; height: 180px; object-fit: cover; display: block; background: #000; }
  .video-label { position: absolute; bottom: 4px; left: 6px;

  .card-scenario { padding: 6px 12px 10px; font-size: 11px; color: #555; }
  .error-badge { position: absolute; top: 4px; right: 6px; font-size: 10px;

function makeCard(a, wave) {
  const card = document.createElement('div');
  card.className = 'card' + (a.active ? ' current' : '');

  const header = document.createElement('div');
  header.className = 'card-header';

  const name = document.createElement('span');
  name.className = 'card-name';
  name.textContent = a.label;

  const waveBadge = document.createElement('span');
  waveBadge.className = 'card-badge';
  waveBadge.textContent = 'W' + wave;

  const badges = [waveBadge];
  if (a.active) {
    const activeBadge = document.createElement('span');
    activeBadge.className = 'card-badge active';
    activeBadge.textContent = 'active';
    badges.push(activeBadge);
  }
  if (a.hidden) {
    const hiddenBadge = document.createElement('span');
    hiddenBadge.className = 'card-badge';
    hiddenBadge.textContent = 'hidden';
    badges.push(hiddenBadge);
  }

  const vibe = document.createElement('span');
  vibe.className = 'card-vibe';
  vibe.textContent = a.vibe;

  header.append(name, ...badges, vibe);

  const videos = document.createElement('div');
  videos.className = 'videos';

  for (const [src, lbl] of [[a.idle, 'idle'], [a.speaking, 'speaking']]) {
    const wrap = document.createElement('div');
    wrap.className = 'video-wrap';

    const vid = document.createElement('video');
    vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
    vid.src = src;

    const label = document.createElement('div');
    label.className = 'video-label';
    label.textContent = lbl;

    const errBadge = document.createElement('div');
    errBadge.className = 'error-badge';
    errBadge.textContent = '404';
    vid.onerror = () => { errBadge.style.display = 'block'; vid.style.opacity = '0.2'; };

    wrap.append(vid, label, errBadge);
    videos.appendChild(wrap);
  }

  const scenario = document.createElement('div');
  scenario.className = 'card-scenario';
  scenario.textContent = '📍 ' + a.scenario;

  card.append(header, videos, scenario);
  return card;
}

const waves = [
  { label: 'Wave 1', avatars: WAVE1, num: 1 },
  { label: 'Wave 2', avatars: WAVE2, num: 2 },
  { label: 'Wave 3', avatars: WAVE3, num: 3 },
];

for (const { label, avatars, num } of waves) {
  const h2 = document.createElement('h2');
  h2.textContent = label + ' — ' + avatars.length + ' avatars';
  document.body.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const a of avatars) grid.appendChild(makeCard(a, num));
  document.body.appendChild(grid);
}
